apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-shop
  namespace: medical-shop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: medical-shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medical-shop
                port:
                  number: 80
