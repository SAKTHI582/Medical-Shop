<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganesh Medicals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="bg-dark">
            <div class="sidebar-header text-center py-4">
                <h4 class="text-white">Ganesh Medicals</h4>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="{{ url_for('home') }}" class="d-flex align-items-center">
                        <i class="bi bi-house me-2"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('dashboard') }}" class="d-flex align-items-center">
                        <i class="bi bi-speedometer2 me-2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('billing') }}" class="d-flex align-items-center">
                        <i class="bi bi-cart-plus me-2"></i>
                        <span>New Bill</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('bills') }}" class="d-flex align-items-center">
                        <i class="bi bi-receipt me-2"></i>
                        <span>Bills</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('medicines') }}" class="d-flex align-items-center">
                        <i class="bi bi-capsule me-2"></i>
                        <span>Medicines</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('add_medicine') }}" class="d-flex align-items-center">
                        <i class="bi bi-plus-circle me-2"></i>
                        <span>Add Medicine</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}" class="d-flex align-items-center text-danger">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-dark">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="mx-auto">
                        <h4 class="mb-0">{% block page_title %}{% endblock %}</h4>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
    $(document).ready(function() {
        // Toggle the sidebar
        $('#sidebarCollapse').on('click', function() {
            $('#sidebar').toggleClass('active');
            $('#content').toggleClass('active');
        });
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
