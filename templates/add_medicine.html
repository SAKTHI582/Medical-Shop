{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <!-- Header -->
            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    <i class="bi bi-capsule"></i>
                    Add New Medicine
                </h4>

            </div>


            <!-- Body -->
            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('add_medicine') }}"
                >

                    <!-- Medicine Name -->
                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label"
                        >
                            Medicine Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter medicine name"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label
                            for="category"
                            class="form-label"
                        >
                            Category
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="category"
                            name="category"
                            placeholder="Example: Tablet, Syrup, Capsule"
                            required
                        >

                    </div>


                    <!-- Batch Number -->
                    <div class="mb-3">

                        <label
                            for="batch_number"
                            class="form-label"
                        >
                            Batch Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="batch_number"
                            name="batch_number"
                            placeholder="Enter batch number"
                            required
                        >

                    </div>


                    <!-- Quantity & Price -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="quantity"
                                class="form-label"
                            >
                                Quantity
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="quantity"
                                name="quantity"
                                min="1"
                                placeholder="Enter quantity"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="price"
                                class="form-label"
                            >
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                class="form-control"
                                id="price"
                                name="price"
                                min="0"
                                placeholder="Enter price"
                                required
                            >

                        </div>

                    </div>


                    <!-- MFG Date & Expiry Date -->
                    <div class="row">

                        <!-- Manufacturing Date -->
                        <div class="col-md-6 mb-3">

                            <label
                                for="mfg_date"
                                class="form-label"
                            >
                                Manufacturing Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="mfg_date"
                                name="mfg_date"
                                required
                            >

                        </div>


                        <!-- Expiry Date -->
                        <div class="col-md-6 mb-3">

                            <label
                                for="expiry_date"
                                class="form-label"
                            >
                                Expiry Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="expiry_date"
                                name="expiry_date"
                                required
                            >

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="mt-3">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            <i class="bi bi-plus-circle"></i>
                            Add Medicine

                        </button>


                        <a
                            href="{{ url_for('medicines') }}"
                            class="btn btn-secondary"
                        >

                            <i class="bi bi-x-circle"></i>
                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Date Validation -->
<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const mfgDate =
            document.getElementById('mfg_date');

        const expiryDate =
            document.getElementById('expiry_date');


        function validateDates() {

            if (
                mfgDate.value &&
                expiryDate.value
            ) {

                if (
                    expiryDate.value <=
                    mfgDate.value
                ) {

                    expiryDate.setCustomValidity(
                        'Expiry date must be after manufacturing date.'
                    );

                } else {

                    expiryDate.setCustomValidity('');

                }

            } else {

                expiryDate.setCustomValidity('');

            }

        }


        mfgDate.addEventListener(
            'change',
            validateDates
        );


        expiryDate.addEventListener(
            'change',
            validateDates
        );

    }
);

</script>

{% endblock %}
