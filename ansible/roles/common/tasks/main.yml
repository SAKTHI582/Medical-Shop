---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install common packages
  ansible.builtin.package:
    name:
      - curl
      - unzip
      - git
      - jq
      - ca-certificates
      - gnupg
      - python3
      - python3-pip
    state: present

- name: Install Docker on Debian/Ubuntu
  when: ansible_os_family == "Debian"
  block:
    - name: Install Docker engine package
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add SSH user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user | default(ansible_user_id) }}"
        groups: docker
        append: true

- name: Install kubectl on Debian/Ubuntu
  when: ansible_os_family == "Debian"
  block:
    - name: Download latest stable kubectl version
      ansible.builtin.shell: |
        set -o pipefail
        curl -L -s https://dl.k8s.io/release/stable.txt
      args:
        executable: /bin/bash
      register: kubectl_version
      changed_when: false

    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

- name: Install Helm
  when: ansible_os_family == "Debian"
  block:
    - name: Download Helm installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0755"

    - name: Run Helm installer
      ansible.builtin.command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm

- name: Verify Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Verify kubectl
  ansible.builtin.command: kubectl version --client
  register: kubectl_version_output
  changed_when: false

- name: Verify Helm
  ansible.builtin.command: helm version --short
  register: helm_version
  changed_when: false

- name: Show installed tool versions
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ kubectl_version_output.stdout }}"
      - "{{ helm_version.stdout }}"
